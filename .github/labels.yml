# =============================================================================
# Opifex label taxonomy — the durable, machine-readable definition.
#
# THE `:` vs `/` SEPARATOR IS LOAD-BEARING. Do not "clean it up".
#
# Per VISION.MD §3.3, labels are a bidirectional edge, never the state machine.
# Two disjoint kinds of factory label exist, and the separator is how a human
# operator tells them apart at a glance, in a list, or in a notification, with
# zero ambiguity:
#
#   factory:*   INPUT  — colon.  Expresses human intent. Opifex OBEYS these.
#                        You set factory:hold and the reconciler stops acting
#                        on that issue. You set factory:ready and it may pick
#                        it up. These are commands you give the factory.
#
#   factory/*   MIRROR — slash.  Written by Opifex for visibility only.
#                        Opifex never reads these as truth — execution state
#                        lives in Postgres (VISION.MD §3.3). These labels are
#                        a projection, not a source of authority. Never set
#                        one by hand expecting it to change behavior.
#
# A label Opifex obeys and a label Opifex merely writes must never be
# confusable, or an operator can set what looks like an instruction and watch
# it silently do nothing. The separator is the whole guarantee.
#
# A THIRD kind exists, outside the `factory` prefix entirely (#303):
#
#   needs:*     ROUTING — colon.  Also human input, and also obeyed — but it
#   tier:*                describes the WORK rather than whether the work
#                         happens. `needs:` says what the work requires of a
#                         runner (#64); `tier:` says which class of model it
#                         wants (#273). #273 declined the `factory:tier-…`
#                         spelling on purpose: `factory:` is a CLOSED
#                         vocabulary of three intents, and widening it would
#                         put "which model class" in the same breath as
#                         "stop".
#
# Colors carry the distinction the separator cannot, since two of the three
# kinds use a colon: input labels are warm (you are steering the factory),
# mirror labels are cool/grey (you are observing it), routing labels are green
# (you are describing the work itself, and neither of the other two).
#
# THIS FILE HAS A TWIN IN CODE, AND CI ASSERTS THEY AGREE (#415).
#
#   apps/api/src/github/labels/label-taxonomy.ts
#
# The API provisions these labels when a repository is registered, and it runs
# in a container — it cannot read this file, and shipping the file into the
# image is how `apps/api/scripts` went missing in #382, silently. So the API
# declares the fifteen CONTROL-LOOP labels (input, mirror, routing) in
# TypeScript, with the same name, colour and description, and
# `label-taxonomy.spec.ts` fails in BOTH directions if the two copies drift.
#
# What that means when you edit here:
#
#  - Changing a control-loop label's colour or description? Change it in
#    `label-taxonomy.ts` too, in the same commit.
#  - Adding a `factory:`, `factory/`, `needs:` or `tier:` label? Same.
#  - Adding or editing anything ELSE — a type, a phase, a component label — is
#    this file's business alone. Those are organisational conventions of THIS
#    repository; the API deliberately does not create them on repositories it
#    watches, because nothing in the control loop reads them and putting a
#    `phase:4` label in somebody else's tracker is presumptuous.
#
# `scripts/sync-labels.mjs` still applies ALL of these, which is correct: it is
# run against this repository by a human who wants this repository's
# conventions.
# =============================================================================

# -----------------------------------------------------------------------------
# Input labels — Opifex OBEYS these (warm palette: you are steering)
# -----------------------------------------------------------------------------
- name: "factory:hold"
  color: "B60205"
  description: "Human intent: stop the factory from acting on this issue. Obeyed by the reconciler."

- name: "factory:ready"
  color: "D93F0B"
  description: "Human intent: this issue is authorized for dispatch. Obeyed by the reconciler."

- name: "factory:clear-quarantine"
  color: "FBCA04"
  description: "Human intent: release this issue/work order from quarantine. Obeyed by the reconciler."

# -----------------------------------------------------------------------------
# Mirror labels — Opifex WRITES these, never reads them as truth (cool/grey
# palette: you are observing, not steering)
# -----------------------------------------------------------------------------
- name: "factory/dispatched"
  color: "1D76DB"
  description: "Mirror: a work order for this issue is currently running. Visibility only — do not hand-edit."

- name: "factory/blocked"
  color: "5319E7"
  description: "Mirror: the run is parked — rate limit, stall, or approval. Visibility only."

- name: "factory/review"
  color: "006B75"
  description: "Mirror: a pull request from this work order awaits review. Visibility only."

- name: "factory/quarantine"
  color: "666666"
  description: "Mirror: quarantined after repeated failure. Visibility only — do not hand-edit."

- name: "factory/label-ignored"
  color: "9E6A03"
  description: "Mirror: a needs:/tier:/factory: label was not understood and was ignored. Visibility only."

# -----------------------------------------------------------------------------
# Routing labels — Opifex OBEYS these too, but they describe the WORK (green
# palette: neither steering the factory nor watching it)
#
# The source of truth for both vocabularies is
# `apps/api/src/github/labels/ignored-labels.ts` (`NEEDS_BY_LABEL`,
# `MODEL_TIER_BY_LABEL`), and `input-labels.spec.ts` fails if an entry there is
# missing here — which is the gap this section closes: for as long as these
# seven were undeclared, `scripts/sync-labels.mjs` could not create them, and a
# label that does not exist on the repository cannot be put on an issue (#303,
# the same failure #195 fixed for `factory:*`).
#
# Both families fail soft, and the same way: an unrecognised value is IGNORED
# rather than rejected, because a spelling mistake must not cost a work order.
# The ignoring is not silent — it comes back as `factory/label-ignored`, and
# the offending name is on the projection's reason. Nothing here is a hard
# requirement on an operator's memory; a work order with no routing label at
# all runs on the defaults.
# -----------------------------------------------------------------------------

# needs:* — what the work requires of a runner, matched against the
# capabilities a runner advertises (#64). A SET: several may apply at once and
# asking for both streaming and cost reporting is coherent, so all four share
# one shade. There is no ranking among them to encode.
- name: "needs:full-streaming"
  color: "1A7F37"
  description: "Routing input: the run must be observable per tool call. Matched against runner capability."

- name: "needs:cost-reporting"
  color: "1A7F37"
  description: "Routing input: the runner must report cost, or budget enforcement is meaningless."

- name: "needs:structured-rate-limits"
  color: "1A7F37"
  description: "Routing input: the runner must report rate limits structurally, so a park can carry a resume."

- name: "needs:own-infrastructure"
  color: "1A7F37"
  description: "Routing input: the work must not leave the operator's own infrastructure."

# tier:* — which class of model the work wants (#273). Mutually exclusive: at
# most one applies, and two at once mean NO tier rather than the larger,
# because picking the largest spends money nobody asked for and picking the
# smallest can park an order forever behind a constraint nobody chose. A
# lighter shade of the same green, the way phase:* takes one colour for its
# whole group: the two routing vocabularies stay one family, and which of them
# you are looking at is legible before you have read the name.
- name: "tier:small"
  color: "8FD9A8"
  description: "Routing input: prefer a small, cheap model class. At most one tier: label — two mean none."

- name: "tier:standard"
  color: "8FD9A8"
  description: "Routing input: prefer the standard model class. At most one tier: label — two mean none."

- name: "tier:large"
  color: "8FD9A8"
  description: "Routing input: prefer a large, costly model class. At most one tier: label — two mean none."

# -----------------------------------------------------------------------------
# Type — what kind of issue this is
# -----------------------------------------------------------------------------
- name: "epic"
  color: "5319E7"
  description: "A multi-feature or multi-session initiative grouping child issues."

- name: "feature"
  color: "0E8A16"
  description: "New functionality."

- name: "bug"
  color: "D73A4A"
  description: "A defect: something works differently than intended."

- name: "chore"
  color: "FEF2C0"
  description: "Tooling, deps, formatting, build, CI — no product behavior change."

- name: "docs"
  color: "0052CC"
  description: "Documentation only."

- name: "decision"
  color: "1D76DB"
  description: "A decision under discussion. Closed by the pull request that merges its ADR."

# -----------------------------------------------------------------------------
# Phase — VISION.MD §12 roadmap phase this work belongs to
# -----------------------------------------------------------------------------
- name: "phase:0"
  color: "5B7FDE"
  description: "Phase 0 — Conventions: issue templates, ADR structure, trailer vocabulary, CI provenance check."

- name: "phase:1"
  color: "5B7FDE"
  description: "Phase 1 — Contracts: work order, runner capability, and run event schemas."

- name: "phase:2"
  color: "5B7FDE"
  description: "Phase 2 — Reconciler, read-only: observe and mirror labels, no dispatch."

- name: "phase:3"
  color: "5B7FDE"
  description: "Phase 3 — Liveness and escalation: git watcher, event ingestion, watchdog, notification path."

- name: "phase:4"
  color: "5B7FDE"
  description: "Phase 4 — Execution: claude-code-local runner, dispatch, budget ceilings, quarantine, auto-resume."

- name: "phase:5"
  color: "5B7FDE"
  description: "Phase 5 — Cockpit: web application for projects, runs, queue, cost, the six metrics."

- name: "phase:6"
  color: "5B7FDE"
  description: "Phase 6 — Supervisor, observe-only: advisory agent writing to a decision log."

- name: "phase:7"
  color: "5B7FDE"
  description: "Phase 7 — Earned autonomy: promotion ladder, trust grants, approval gates, digest."

- name: "phase:8"
  color: "5B7FDE"
  description: "Phase 8 — Second runner: only when quota pressure or vendor risk justifies it."

