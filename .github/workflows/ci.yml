name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Node version follows the `engines.node` constraint in the root package.json
# (>=24) and every workspace package.json (apps/api, apps/web).
env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # The changelog check at the end of this job walks base..head, so the
      # shallow default clone is not enough — `base` would not exist locally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Neither workspace's ESLint config uses the type-checked preset, so
      # unlike `typecheck` this job needs no generated Prisma client.
      - name: Lint api
        run: npm -w apps/api run lint

      - name: Lint web
        run: npm -w apps/web run lint

      # `--check` fails rather than rewriting, so an unformatted file is a red
      # build and not a surprise commit from CI.
      - name: Check formatting
        run: npx prettier --check .

      # #35: "a schema edit that is not reflected in code fails the build".
      # Regenerates and diffs, so a schema changed without re-running the
      # generator is caught here rather than by whatever mis-parses first. This
      # is also what makes writing the types into both apps safe — two copies of
      # a generated file are only one source of truth while something checks it.
      - name: Check generated contract types are current
        run: npm run contracts:check

      # #312: CHANGELOG.md went ninety-four commits stale because the only
      # thing holding the convention up was "remember to update it". This
      # fails a pull request whose commits include a `feat` or a `fix` and
      # whose diff does not touch CHANGELOG.md. There is no opt-out: the
      # commit type IS the opt-out, since a change that warrants no changelog
      # line is a `chore`, `refactor`, `test` or `docs` by definition. See the
      # header of scripts/check-changelog.mjs.
      #
      # A step in this job rather than a new one, deliberately. A new job
      # becomes a new required status check, which needs a branch-protection
      # change to take effect — a step in a job that is already required takes
      # effect on merge. `check:prisma-fields` in the Typecheck job below is
      # the precedent. This lives in Lint because it needs neither a generated
      # Prisma client nor a build, and it is the same documentation-hygiene
      # family as `prettier --check`.
      #
      # Pull requests only. This workflow also runs on pushes to `main`, where
      # there is no pull request, no base/head pair, and (since `main` is
      # merge-commit-only) a first-parent walk that would see nothing but
      # merges anyway.
      - name: Check the changelog
        if: github.event_name == 'pull_request'
        run: >
          node scripts/check-changelog.mjs
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The dump boots the Nest app in preview mode — no database, no
      # credentials — but the modules it loads still import @prisma/client at
      # require time, and that is generated rather than checked in.
      - name: Generate Prisma client
        run: npm -w apps/api run prisma:generate

      # Dumped fresh rather than read from the repository. A committed spec is
      # a generated file that drifts the moment a controller changes without
      # someone remembering to re-run this.
      - name: Dump the OpenAPI document
        run: npm run openapi:dump

      - name: Lint the OpenAPI document
        run: npm run openapi:lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/api's typecheck (`tsc --noEmit`) resolves types from the
      # generated Prisma client, which is not checked into the repo.
      - name: Generate Prisma client
        run: npm -w apps/api run prisma:generate

      - name: Typecheck web
        run: npm -w apps/web run typecheck

      - name: Typecheck api
        run: npm -w apps/api run typecheck

      # `tsc` cannot see inside a Prisma `data:`/`where:` literal — it is a
      # generic inference target, so an invented field name compiles and is
      # then rejected at runtime with `Unknown argument` (#159). This checks
      # every such literal against the generated input types. It runs here
      # because this job already has the generated client.
      - name: Check Prisma field names
        run: npm -w apps/api run check:prisma-fields

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    # #440 / #321: `npm run api:test` runs `apps/api`'s default `test` script
    # — every `*.spec.ts` under src/ and test/ EXCEPT paths matching "e2e"
    # (see apps/api/package.json). Most of those resolve PrismaService
    # through the mock in apps/api/test/mocks/prisma.mock.ts via
    # apps/api/test/helpers/test-app.helper.ts (`useMockDatabase` defaults to
    # `true`) and never touch this service at all — verified, not assumed;
    # see the PR that added this block. But a handful of
    # `test/integration/*.integration.spec.ts` files talk to a REAL
    # database directly (`new PrismaService()`, no mock) and guard themselves
    # with `describeIfDb` (apps/api/test/helpers/database-guard.helper.ts):
    # `describe` when DATABASE_URL/POSTGRES_HOST is reachable, `describe.skip`
    # on a developer machine when it is not, and — since GitHub Actions sets
    # `CI=true` on every job unconditionally — a single FAILING test here
    # instead of a skip, because a CI run that silently skipped a
    # database-backed suite is exactly the bug both issues describe: a green
    # check reporting on a strictly smaller set of tests than it appears to.
    #
    # So this job provisions the same test database those specs already know
    # how to find, matching infra/compose/test.compose.yml's `db-test`
    # service exactly (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB =
    # postgres/postgres/opifex_test) — do not invent different values here
    # without re-verifying against that file. Migrations only, no
    # `prisma:seed`: every currently-guarded integration spec either builds
    # its own fixtures or asserts against a row a MIGRATION seeds (the
    # `operator_settings_revision` singleton, #336), not the RBAC rows
    # `prisma/seed.ts` creates.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opifex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opifex_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opifex_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm -w apps/api run prisma:generate

      # `prisma:migrate` is `migrate deploy` (scripts/prisma-env.js), which
      # applies every committed migration and nothing else — no db push, no
      # implicit schema sync, so a migration missing from the repo fails here
      # the same way it would in a real deployment.
      - name: Apply database migrations
        run: npm -w apps/api run prisma:migrate

      - name: Run API tests
        run: npm run api:test

  test-web:
    name: Test web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/web's `test:ci` script (vitest run --coverage --reporter=junit)
      # is the CI-oriented variant; the root `web:test` script maps to plain
      # `vitest`, which is interactive/watch-oriented outside of CI-mode
      # detection.
      - name: Run web tests
        run: npm -w apps/web run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - openapi
      - typecheck
      - test-api
      - test-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm -w apps/api run prisma:generate

      - name: Build api
        run: npm -w apps/api run build

      - name: Build web
        run: npm -w apps/web run build
