version: 2
updates:
  # Root workspace (devDependencies, tooling shared across the npm workspaces).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # apps/api — NestJS backend.
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  # apps/web — React frontend.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
