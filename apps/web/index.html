<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Opifex — a control plane that supervises AI coding agents."
    />

    <!-- Icons. SVG first (sharp at any size, carries its own dark-mode rule);
         the .ico is the 16/32/48px fallback. See src/theme/tokens.ts. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="icon"
      type="image/x-icon"
      sizes="16x16 32x32 48x48"
      href="/favicon.ico"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- background.default per mode, mirrored by hand from src/theme/tokens.ts
         (static HTML cannot import it). Two entries because the app follows the
         system theme and one value would be wrong in the other mode. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#F7F8FA"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0F172A"
    />
    <meta name="color-scheme" content="light dark" />

    <title>Opifex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
