# =============================================================================
# Nginx Configuration - Reverse Proxy
# =============================================================================
# Routes:
#   /           -> web (React frontend)
#   /api        -> api (NestJS backend)
#   /api/docs   -> api (Swagger UI)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Dynamic upstream resolution
    #
    # Docker's embedded DNS server. A static `upstream { server api:3000; }`
    # block resolves the name once at startup and caches the address forever,
    # so recreating a container (docker compose up -d --build) hands it a new
    # IP and nginx serves 502 until it is restarted by hand. Pointing
    # proxy_pass at a variable defers resolution to request time, so the
    # resolver re-checks on its `valid` interval and redeploys self-heal.
    #
    # Trade-off: a variable proxy_pass bypasses `upstream` blocks, giving up
    # their keepalive connection pooling. Acceptable for a same-origin proxy
    # in front of two containers.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Content Security Policy, kept in its own file at http scope because it
    # defines a `map $uri $csp_policy` (maps are only valid here). The server
    # block below emits it with a single add_header.
    #
    # Two reasons it lives outside this file: the development overlay swaps in
    # a policy permitting the Vite dev server's inline React Refresh preamble,
    # and /api/docs needs a different policy from the rest of the app. Splitting
    # it out lets dev.compose.yml mount csp.dev.conf over the same path instead
    # of duplicating this whole config.
    include /etc/nginx/csp.conf;

    # Simple uploads (POST /api/storage/objects) are capped at 100MB by the
    # @fastify/multipart limit in apps/api/src/main.ts. Sit just above it so
    # oversized requests reach the API and get a JSON error instead of nginx's
    # HTML 413. Resumable uploads use pre-signed URLs straight to S3 and never
    # pass through here. nginx's own default is 1m, which would reject most
    # uploads outright.
    client_max_body_size 128m;

    server {
        listen 80;
        server_name localhost;

        # ---------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------
        # NOTE: nginx's add_header REPLACES, it does not merge. Any location
        # block that declares its own add_header loses every header set here,
        # so a location needing an extra header must repeat these too.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # HSTS. Browsers ignore this over plain HTTP, so it is inert for local
        # development on http://localhost:3535 and takes effect only once the
        # app is served over TLS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy. The value is selected per request URI by the
        # `map $uri $csp_policy` in the csp.conf included at http scope above:
        # the application gets the strict policy, /api/docs gets one that also
        # permits the Scalar reference bundle. base.compose.yml mounts
        # infra/nginx/csp.conf there; dev.compose.yml mounts csp.dev.conf.
        add_header Content-Security-Policy $csp_policy always;

        # -------------------------------------------------------------------------
        # API routes -> NestJS backend
        # -------------------------------------------------------------------------
        location /api {
            # Variable target forces per-request re-resolution via the resolver
            # declared above. No URI part, so the original request URI passes
            # through unchanged.
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # -------------------------------------------------------------------------
        # Frontend routes -> React app
        # -------------------------------------------------------------------------
        location / {
            # $web_upstream is set by the included file, not inline here, for
            # the same reason $csp_policy above comes from an included file:
            # base.compose.yml mounts web-upstream.conf (port 80, the
            # production static-file server); dev.compose.yml mounts
            # web-upstream.dev.conf (port 5173, the Vite dev server) over the
            # same container path. See infra/nginx/web-upstream.conf.
            include /etc/nginx/web-upstream.conf;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for HMR in development
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------------------
        # Health check endpoint for nginx itself
        # -------------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            # default_type rather than add_header: add_header here would
            # replace the server-level security headers for this location.
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
