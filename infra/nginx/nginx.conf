# =============================================================================
# Nginx Configuration - Reverse Proxy
# =============================================================================
# Routes:
#   /           -> web (React frontend)
#   /api        -> api (NestJS backend)
#   /api/docs   -> api (Swagger UI)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Upstream definitions
    upstream api_upstream {
        server api:3000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:5173;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # ---------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------
        # NOTE: nginx's add_header REPLACES, it does not merge. Any location
        # block that declares its own add_header loses every header set here,
        # so a location needing an extra header must repeat these too.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # HSTS. Browsers ignore this over plain HTTP, so it is inert for local
        # development on http://localhost:3535 and takes effect only once the
        # app is served over TLS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy.
        #   style-src allows 'unsafe-inline' because MUI/emotion injects styles
        #     at runtime; removing it requires migrating to nonce-based styles.
        #   img-src allows https: because avatars come from Google
        #     (lh3.googleusercontent.com) and uploaded images are served from a
        #     configurable S3 endpoint, which may be AWS or MinIO.
        #   connect-src is 'self' only: the frontend talks to /api same-origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        # -------------------------------------------------------------------------
        # API routes -> NestJS backend
        # -------------------------------------------------------------------------
        location /api {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # -------------------------------------------------------------------------
        # Frontend routes -> React app
        # -------------------------------------------------------------------------
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for HMR in development
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------------------
        # Health check endpoint for nginx itself
        # -------------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            # default_type rather than add_header: add_header here would
            # replace the server-level security headers for this location.
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
