# =============================================================================
# Content Security Policy - development overlay
# =============================================================================
# Mounted over /etc/nginx/csp.conf by dev.compose.yml. NEVER used in
# production: prod.compose.yml leaves the strict csp.conf from base in place.
#
# Why this has to differ from csp.conf:
#
#   The Vite dev server rewrites index.html to include an INLINE
#   <script type="module"> that installs the React Refresh preamble
#   (injectIntoGlobalHook). Under the strict `script-src 'self'` the browser
#   blocks that inline script, @vitejs/plugin-react then throws
#   "can't detect preamble. Something is wrong." above the ErrorBoundary, and
#   the app renders a blank page. 'unsafe-inline' is what lets the preamble run.
#
#   'unsafe-eval' covers the dev-only evaluation Vite/React Refresh perform
#   while transforming modules on the fly.
#
# A production build contains no inline preamble and needs neither keyword,
# which is why this relaxation is confined to the development overlay.
# =============================================================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
