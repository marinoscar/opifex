# =============================================================================
# Web upstream - default (production)
# =============================================================================
# Included from the `location /` block in nginx.conf, which proxies to
# whatever this file sets $web_upstream to. base.compose.yml mounts this file
# at /etc/nginx/web-upstream.conf; dev.compose.yml mounts web-upstream.dev.conf
# over the same path, mirroring the csp.conf / csp.dev.conf split (see that
# file's header) for the same reason: the two environments run genuinely
# different servers behind the `web` container name, not just different
# settings of one server.
#
# Port 80: apps/web/Dockerfile's `production` stage builds the static bundle
# and serves it with its own nginx on 80. It is not the Vite dev server, which
# is why this is a separate file rather than a build ARG or an environment
# variable substituted into one nginx.conf -- the port is a fact about which
# stage the image was built from, fixed at image-build time, not something a
# deployment tunes.
# =============================================================================

set $web_upstream http://web:80;
