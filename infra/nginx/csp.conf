# =============================================================================
# Content Security Policy - default (production-grade)
# =============================================================================
# Included from the server block in nginx.conf. base.compose.yml mounts this
# file at /etc/nginx/csp.conf; dev.compose.yml mounts csp.dev.conf over the
# same path so the development stack can relax script-src without duplicating
# the whole of nginx.conf.
#
#   script-src is 'self' only. A production build emits no inline scripts, so
#     nothing legitimate needs 'unsafe-inline' here.
#   style-src allows 'unsafe-inline' because MUI/emotion injects styles at
#     runtime; removing it requires migrating to nonce-based styles.
#   img-src allows https: because avatars come from Google
#     (lh3.googleusercontent.com) and uploaded images are served from a
#     configurable S3 endpoint, which may be AWS or MinIO.
#   connect-src is 'self' only: the frontend talks to /api same-origin.
# =============================================================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
