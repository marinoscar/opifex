# =============================================================================
# Web upstream - development overlay
# =============================================================================
# Mounted over /etc/nginx/web-upstream.conf by dev.compose.yml. NEVER used in
# production: prod.compose.yml leaves web-upstream.conf from base in place.
#
# Port 5173: apps/web/Dockerfile's `development` stage runs the Vite dev
# server (`npm run dev -- --host`), which listens there, not on 80 -- the
# production stage's static-file nginx never runs in dev at all.
# =============================================================================

set $web_upstream http://web:5173;
