# =============================================================================
# Docker Compose - Base Services
# =============================================================================
# Usage (run from infra/compose folder):
#   docker compose -f base.compose.yml -f dev.compose.yml up
#
# With observability:
#   docker compose -f base.compose.yml -f dev.compose.yml -f otel.compose.yml up
#
# Production:
#   docker compose -f base.compose.yml -f prod.compose.yml up
#
# Note: .env file is in this folder (infra/compose/)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx - Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.30-alpine
    ports:
      # Parameterized so local development keeps the documented
      # http://localhost:3535 while the dev.marin.cr VPS sets NGINX_PORT=8328
      # in infra/compose/.env — the opifex slot in that host's nginx
      # `map $host $backend_port` block. See docs/ssl-nginx-setup.md.
      - "${NGINX_PORT:-3535}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # nginx.conf includes this path. dev.compose.yml mounts csp.dev.conf over
      # it so the Vite dev server's inline preamble is not blocked; production
      # keeps the strict policy.
      - ../nginx/csp.conf:/etc/nginx/csp.conf:ro
    depends_on:
      - api
      - web
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # API - NestJS Backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    # Load every variable from .env rather than enumerating them here. An
    # explicit `environment:` list silently drops anything added to
    # .env.example later — APP_URL, COOKIE_SECRET, CORS_ORIGIN, the STORAGE_*
    # limits and the DEVICE_* settings were all being dropped this way, so a
    # deployed instance fell back to APP_URL=http://localhost:3535 and sent
    # OAuth users to localhost. Per-mode overrides still belong in
    # dev/prod.compose.yml, where `environment:` takes precedence over env_file.
    env_file:
      - .env
    # -------------------------------------------------------------------------
    # Runner state that must outlive an image rebuild (#327)
    # -------------------------------------------------------------------------
    # Declared in base rather than per mode: a rebuild discards the container's
    # writable layer identically in development and production.
    #
    # The workspace root is where RunWorkspaceService builds idempotency. #18's
    # exit criterion is that "re-running the same work order is idempotent — the
    # runner checks whether its branch already exists before doing anything",
    # and finding an existing workspace at the right commit is what makes a
    # re-submit a REUSE rather than a second clone. Without this volume every
    # recovery becomes a full re-clone, at exactly the moment recovery is most
    # likely to be wanted: a rebuild is what an operator does when something is
    # already wrong.
    #
    # Interpolated from the same variable the API reads, with the same default
    # as configuration.ts, so changing RUNNER_WORKSPACE_ROOT in .env moves both
    # the mount and the code that writes to it. Hardcoding the path here would
    # let the two silently disagree, and the symptom would be a workspace root
    # that is simply not persisted.
    #
    # WHAT THIS DOES NOT BUY: a live run does not survive a restart. ADR-0008
    # makes the agents children of the API process, so restarting this container
    # still kills every run in flight. The volume preserves the checkout, not
    # the work.
    volumes:
      - runner-workspaces:${RUNNER_WORKSPACE_ROOT:-/var/tmp/opifex/workspaces}
      # The CLI's own state under $HOME (/root in this image) — history and
      # caches. Lesser stakes than the workspace root: with credentials supplied
      # by environment (#326) nothing load-bearing lives here, so losing it
      # costs cache warmth rather than the ability to authenticate.
      - runner-claude-home:/root/.claude
    networks:
      - app-network
      # Shared external network carrying the central postgres container
      # (reachable as hostname `postgres`). Required wherever .env sets
      # POSTGRES_HOST=postgres, as it does on the dev.marin.cr VPS.
      - devnet

  # ---------------------------------------------------------------------------
  # Web - React Frontend
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    networks:
      - app-network

# =============================================================================
# Volumes
# =============================================================================
# Named rather than bind-mounted: nothing here is meant to be edited from the
# host, and a bind mount would put the agent's checkouts into somebody's home
# directory by accident.
volumes:
  runner-workspaces:
  runner-claude-home:

# =============================================================================
# Networks
# =============================================================================
networks:
  app-network:
    driver: bridge
  # Created once per host with `docker network create devnet`. The central
  # postgres container shared with the other dev.marin.cr apps lives here and
  # resolves as hostname `postgres`. See docs/ssl-nginx-setup.md.
  devnet:
    external: true
    name: devnet
